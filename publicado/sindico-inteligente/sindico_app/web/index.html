<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Síndico Inteligente</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<aside>
  <div class="brand"><span class="brand-mark">SI</span><div><strong>Síndico Inteligente</strong><small>Central operacional</small></div></div>
  <nav id="nav">
    <button class="active" data-view="dashboard"><span>▦</span> Visão geral</button>
    <button data-view="documents"><span>▤</span> Documentos & IA</button>
    <button data-view="occurrences"><span>⚠</span> Ocorrências</button>
    <button data-view="tasks"><span>✓</span> Tarefas</button>
    <button data-view="announcements"><span>◉</span> Comunicados</button>
    <button data-view="reservations"><span>▣</span> Reservas</button>
    <button data-view="contacts"><span>♙</span> Contatos</button>
  </nav>
  <div class="side-footer"><span class="status-dot"></span> Dados salvos localmente
    <button class="text-btn" onclick="backup()">Criar backup</button>
    <button class="text-btn" onclick="exportData()">Exportar dados</button>
  </div>
</aside>
<main>
  <header><div><p class="eyebrow">CONDOMÍNIO • OPERAÇÃO LOCAL</p><h1 id="pageTitle">Visão geral</h1></div><div class="today" id="today"></div></header>
  <section id="content"><div class="loading">Carregando central operacional…</div></section>
</main>
<dialog id="modal"><form method="dialog"><div class="modal-head"><div><p class="eyebrow" id="modalKicker">NOVA AÇÃO</p><h2 id="modalTitle"></h2></div><button class="icon" value="cancel" aria-label="Fechar">×</button></div><div id="modalBody"></div><div class="modal-actions"><button class="secondary" value="cancel">Cancelar</button><button type="button" class="primary" id="modalConfirm">Revisar e continuar</button></div></form></dialog>
<dialog id="confirm"><form method="dialog"><p class="eyebrow">CONFIRMAÇÃO OBRIGATÓRIA</p><h2>Revise antes de salvar</h2><div id="confirmBody"></div><div class="modal-actions"><button class="secondary" value="cancel">Voltar</button><button type="button" class="danger" id="commitButton">Confirmar ação</button></div></form></dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
