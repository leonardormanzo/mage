; Firmware do Arcia Axle-E — ESP32-S3 (Arduino + FreeRTOS) e testes no PC.
;   pio run -e esp32s3             compila para o ESP32-S3
;   pio run -e esp32s3 -t upload   grava na placa
;   pio device monitor             console serial (115200)
;   pio test -e native             roda os testes do núcleo no computador (precisa de g++ no PATH)

[platformio]
default_envs = esp32s3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel @ ^1.12.0

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = ${env.build_flags} -DAXLE_NATIVE -DUNITY_INCLUDE_DOUBLE
