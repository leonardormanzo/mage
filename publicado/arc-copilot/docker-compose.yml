services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arc_copilot
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
    ports:
      - "5432:5432"
    volumes:
      - arc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://arc:arc@db:5432/arc_copilot
      SECRET_KEY: local-docker-change-before-production
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  arc_postgres:

