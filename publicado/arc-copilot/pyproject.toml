[project]
name = "arc-copilot"
version = "1.0.0"
description = "Assistente rastreavel para registro de obra, estoque, RDO e consultas."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "reportlab>=4.2,<5",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "google-generativeai>=0.8.0,<1",
  "pgvector>=0.3,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["tests*", "migrations*", "storage*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
  "B008", # FastAPI usa Depends/File nos valores padrão por contrato do framework.
  "E501", # O formatter preserva algumas assinaturas e mensagens longas legíveis.
]
